services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: handbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handbook_local}
      POSTGRES_DB: handbook
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_checkpoints:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handbook -d handbook"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_checkpoints:
  qdrant_storage:
